name: Bug report
description: Something in Dictor behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Dictor keeps a log at `~/Library/Logs/Dictor.log`, and the app can
        assemble a privacy-safe report for you: menu-bar icon → right click →
        Support → Copy Diagnostics. It contains no transcript text.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dictor version
      description: Settings → General → Version, or the menu-bar panel.
      placeholder: "1.1.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.6, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the diagnostics report here if you have it.
      render: text
